name: 新功能建议
description: 提出新的学习内容、协作改进或其他功能建议。
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！本仓库目前用于学习 Git 与 GitHub，没有独立的应用程序或已发布的软件功能。
        请先搜索相关 Issues；只有“希望解决的问题”和“建议内容”为必填，其余可按需补充。
  - type: textarea
    id: problem
    attributes:
      label: 希望改进或解决的问题
      description: 描述使用场景、遇到的困难，或当前内容的不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 新功能或改进的具体描述
      description: 希望增加或改变什么？完成后应是什么样子？
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 所属模块
      placeholder: 例如学习文档、贡献流程、自动化检查；不确定时可留空
  - type: textarea
    id: value
    attributes:
      label: 预期用途和实际价值
      description: 谁会使用这项改进？它能带来什么帮助？
  - type: textarea
    id: implementation
    attributes:
      label: 可选的实现思路
      description: 如果有思路，可以描述实施步骤；不要求提供代码或完整方案。
  - type: textarea
    id: alternatives
    attributes:
      label: 是否考虑过其他解决方案
      description: 可描述已有替代方案，以及它们为什么不能充分解决问题。
  - type: textarea
    id: references
    attributes:
      label: 补充资料
      description: 可提供相关 Issue、文档链接、示意图或截图；请勿包含敏感信息。
